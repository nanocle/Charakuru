chor="start" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic UI','Segoe UI',sans-serif">front/left/right/back: 8 images</text><line x1="446" y1="137" x2="532" y2="137" stroke="#7c8db5" stroke-width="2" marker-end="url(#a)"/><text x="490" y="125" font-size="12" font-weight="400" fill="#8b97b3" text-anchor="middle" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic UI','Segoe UI',sans-serif">copy request</text><path d="M740 182 C 740 208, 240 192, 240 206" fill="none" stroke="#7c8db5" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="214" width="400" height="82" rx="12" fill="#121a33" stroke="url(#g)" stroke-width="2"/><circle cx="74" cy="255" r="17" fill="url(#g)"/><text x="74" y="261" font-size="17" font-weight="700" fill="#0b1020" text-anchor="middle" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic UI','Segoe UI',sans-serif">2</text><text x="106" y="247" font-size="16" font-weight="400" fill="#e6ebf5" text-anchor="start" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic UI','Segoe UI',sans-serif">Review the 8 images</text><text x="106" y="269.4" font-size="16" font-weight="400" fill="#e6ebf5" text-anchor="start" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic UI','Segoe UI',sans-serif">(you can ask to fix just one)</text><rect x="540" y="214" width="400" height="82" rx="12" fill="#151329" stroke="#4c3f86" stroke-width="1.5" stroke-dasharray="6 5"/><text x="562" y="247" font-size="15" font-weight="400" fill="#d6d0f5" text-anchor="start" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic UI','Segoe UI',sans-serif">Generates 4 head and 4 body</text><text x="562" y="268" font-size="15" font-weight="400" fill="#d6d0f5" text-anchor="start" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic UI','Segoe UI',sans-serif">3D candidates in Tripo</text><line x1="446" y1="255" x2="532" y2="255" stroke="#7c8db5" stroke-width="2" marker-end="url(#a)"/><text x="490" y="243" font-size="12" font-weight="400" fill="#8b97b3" text-anchor="middle" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic UI','Segoe UI',sans-serif">copy request</text><path d="M740 300 C 740 326, 240 310, 240 324" fill="none" stroke="#7c8db5" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="332" width="400" height="82" rx="12" fill="#121a33" stroke="url(#g)" stroke-width="2"/><circle cx="74" cy="373" r="17" fill="url(#g)"/><text x="74" y="379" font-size="17" font-weight="700" fill="#0b1020" text-anchor="middle" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic UI','Segoe UI',sans-serif">3</text><text x="106" y="365" font-size="16" font-weight="400" fill="#e6ebf5" text-anchor="start" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic UI','Segoe UI',sans-serif">Pick one head and</text><text x="106" y="387.4" font-size="16" font-weight="400" fill="#e6ebf5" text-anchor="start" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic UI','Segoe UI',sans-serif">one body candidate</text><rect x="540" y="332" width="400" height="82" rx="12" fill="#151329" stroke="#4c3f86" stroke-width="1.5" stroke-dasharray="6 5"/><text x="562" y="365" font-size="15" font-weight="400" fill="#d6d0f5" text-anchor="start" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic UI','Segoe UI',sans-serif">Sorts parts, UV-unwraps,</text><text x="562" y="386" font-size="15" font-weight="400" fill="#d6d0f5" text-anchor="start" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic UI','Segoe UI',sans-serif">4K retexture, assembles</text><line x1="446" y1="373" x2="532" y2="373" stroke="#7c8db5" stroke-width="2" marker-end="url(#a)"/><text x="490" y="361" font-size="12" font-weight="400" fill="#8b97b3" text-anchor="middle" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic UI','Segoe UI',sans-serif">copy request</text><path d="M740 418 C 740 444, 240 428, 240 442" fill="none" stroke="#7c8db5" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="450" width="400" height="82" rx="12" fill="#121a33" stroke="url(#g)" stroke-width="2"/><circle cx="74" cy="491" r="17" fill="url(#g)"/><text x="74" y="497" font-size="17" font-weight="700" fill="#0b1020" text-anchor="middle" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic UI','Segoe UI',sans-serif">4</text><text x="106" y="483" font-size="16" font-weight="400" fill="#e6ebf5" text-anchor="start" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic UI','Segoe UI',sans-serif">Match head-to-body</text><text x="106" y="505.4" font-size="16" font-weight="400" fill="#e6ebf5" text-anchor="start" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic UI','Segoe UI',sans-serif">proportions</text><rect x="540" y="450" width="400" height="82" rx="12" fill="#151329" stroke="#4c3f86" stroke-width="1.5" stroke-dasharray="6 5"/><text x="562" y="483" font-size="15" font-weight="400" fill="#d6d0f5" text-anchor="start" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic UI','Segoe UI',sans-serif">Rigging, weight transfer,</text><text x="562" y="504" font-size="15" font-weight="400" fill="#d6d0f5" text-anchor="start" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic UI','Segoe UI',sans-serif">hair and outfit physics</text><line x1="446" y1="491" x2="532" y2="491" stroke="#7c8db5" stroke-width="2" marker-end="url(#a)"/><text x="490" y="479" font-size="12" font-weight="400" fill="#8b97b3" text-anchor="middle" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic UI','Segoe UI',sans-serif">copy request</text><path d="M740 536 C 740 562, 240 546, 240 560" fill="none" stroke="#7c8db5" stroke-width="2" marker-end="url(#a)"/><rect x="40" y="568" width="400" height="82" rx="12" fill="#121a33" stroke="url(#g)" stroke-width="2"/><circle cx="74" cy="609" r="17" fill="url(#g)"/><text x="74" y="615" font-size="17" font-weight="700" fill="#0b1020" text-anchor="middle" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic UI','Segoe UI',sans-serif">5</text><text x="106" y="601" font-size="16" font-weight="400" fill="#e6ebf5" text-anchor="start" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic UI','Segoe UI',sans-serif">Check the motion</text><text x="106" y="623.4" font-size="16" font-weight="400" fill="#e6ebf5" text-anchor="start" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic UI','Segoe UI',sans-serif">with a walk cycle</text><rect x="540" y="568" width="400" height="82" rx="12" fill="#151329" stroke="#4c3f86" stroke-width="1.5" stroke-dasharray="6 5"/><text x="562" y="601" font-size="15" font-weight="400" fill="#d6d0f5" text-anchor="start" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic UI','Segoe UI',sans-serif">Exports the VRM and an</text><text x="562" y="622" font-size="15" font-weight="400" fill="#d6d0f5" text-anchor="start" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic UI','Segoe UI',sans-serif">editable Blender file</text><line x1="446" y1="609" x2="532" y2="609" stroke="#7c8db5" stroke-width="2" marker-end="url(#a)"/><text x="490" y="597" font-size="12" font-weight="400" fill="#8b97b3" text-anchor="middle" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic UI','Segoe UI',sans-serif">copy request</text><path d="M740 654 L 740 694" stroke="#7c8db5" stroke-width="2" marker-end="url(#a)"/><rect x="540" y="700" width="400" height="56" rx="28" fill="url(#g)"/><text x="740" y="735" font-size="17" font-weight="700" fill="#0b1020" text-anchor="middle" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic UI','Segoe UI',sans-serif">Done: avatar.vrm and avatar.blend</text></svg>